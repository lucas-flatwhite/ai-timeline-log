name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - run: npm run check          # precheck builds the plate font list (src/generated/plate.json) first
      - run: npm test
      - run: npm run build
      - run: npm run budget

  # Browser tests: run Chromium and WebKit (the Safari engine) side by side. The config (playwright.config.ts) builds the site and starts the preview server.
  # WebKit catches Safari-only problems (for example, links not taking focus on mouse click)
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: 'true'
