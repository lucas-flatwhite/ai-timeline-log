name: poster

# Renders the edition poster and uploads it to GitHub Releases. Poster files stay out of the repository and the site (Vercel).
# After the Release, npm run poster:pull fetches the small preview and file sizes for the poster and data block, and they are committed in the PR (edition-release skill).
# To cut an edition: merge an edition with poster: true in content/editions.yaml, then push an edition-<n> tag on that commit.
on:
  push:
    tags: ['edition-*']
  workflow_dispatch:
    inputs:
      edition:
        description: Edition number (the edition-<n> tag must exist)
        required: true
        type: string

permissions:
  contents: write   # Creates the Release and uploads files. Granted to this workflow only

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || '' }}
    steps:
      - name: Edition number
        id: ed
        run: |
          n="${N:-${GITHUB_REF_NAME#edition-}}"
          if ! [[ "$n" =~ ^[0-9]+$ ]]; then echo "Not an edition number: $n" >&2; exit 1; fi
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: edition-${{ steps.ed.outputs.n }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - name: Check that this edition has a poster
        run: node scripts/poster.ts --edition ${{ steps.ed.outputs.n }} --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Preview server
        run: |
          npx astro preview --port 4321 --ignore-lock > preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4321/ai-timeline-log/ && exit 0
            sleep 1
          done
          cat preview.log; exit 1
      - name: Render posters
        run: node scripts/poster.ts --edition ${{ steps.ed.outputs.n }} --locale ko,en --out out
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: edition-${{ steps.ed.outputs.n }}
        run: |
          node -e '
            const { parse } = require("yaml");
            const e = parse(require("fs").readFileSync("content/editions.yaml", "utf8")).find(x => x.n === Number(process.argv[1]));
            const [y, m, d] = String(e.date instanceof Date ? e.date.toISOString().slice(0, 10) : e.date).split("-");
            // Like the site, the Release defaults to English. The Korean poster files are uploaded with it
            require("fs").writeFileSync("title.txt", `Edition ${e.n} · ${y}.${m}.${d}`);
            require("fs").writeFileSync("notes.md", `${e.en}\n`);
          ' "${{ steps.ed.outputs.n }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "$(cat title.txt)" --notes-file notes.md --verify-tag
          fi
