name: poster

# 판 포스터를 찍어 GitHub Releases에 올린다. 포스터 파일은 저장소와 사이트(Vercel)에 두지 않는다.
# 판을 찍는 법: content/editions.yaml에 poster: true인 판을 적어 머지한 뒤, 그 커밋에 edition-<n> 태그를 푸시한다.
on:
  push:
    tags: ['edition-*']
  workflow_dispatch:
    inputs:
      edition:
        description: 판 번호 (edition-<n> 태그가 있어야 한다)
        required: true
        type: string

permissions:
  contents: write   # Release를 만들고 파일을 올린다. 이 워크플로에만 준다

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || '' }}
    steps:
      - name: 판 번호
        id: ed
        run: |
          n="${N:-${GITHUB_REF_NAME#edition-}}"
          if ! [[ "$n" =~ ^[0-9]+$ ]]; then echo "판 번호가 아닙니다: $n" >&2; exit 1; fi
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: edition-${{ steps.ed.outputs.n }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - name: 포스터를 낼 판인지 확인
        run: node scripts/poster.ts --edition ${{ steps.ed.outputs.n }} --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: 미리보기 서버
        run: |
          npx astro preview --port 4321 --ignore-lock > preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4321/ai-timeline-log/ && exit 0
            sleep 1
          done
          cat preview.log; exit 1
      - name: 포스터 찍기
        run: node scripts/poster.ts --edition ${{ steps.ed.outputs.n }} --locale ko,en --out out
      - name: Release에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: edition-${{ steps.ed.outputs.n }}
        run: |
          node -e '
            const { parse } = require("yaml");
            const e = parse(require("fs").readFileSync("content/editions.yaml", "utf8")).find(x => x.n === Number(process.argv[1]));
            const [y, m, d] = String(e.date instanceof Date ? e.date.toISOString().slice(0, 10) : e.date).split("-");
            require("fs").writeFileSync("title.txt", `제 ${e.n}판 · ${y}.${m}.${d} / Edition ${e.n}`);
            require("fs").writeFileSync("notes.md", `${e.ko}\n\n${e.en}\n`);
          ' "${{ steps.ed.outputs.n }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "$(cat title.txt)" --notes-file notes.md --verify-tag
          fi
