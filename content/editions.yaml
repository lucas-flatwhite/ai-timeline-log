  en: Adds five scenes on labs preparing to go public, open weights, always-on agents, verifying AI proofs and taking AI offline, and corrects two.
- n: 4
  date: 2026-10-31
  poster: true
  ko: 동반자 챗봇 규칙, 사이버 방어, ETH 반증 검토까지 장면 3개를 더하고 모델 계보를 보강했다. 포스터로 찍은 첫 판.
