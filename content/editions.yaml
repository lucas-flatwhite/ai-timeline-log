  en: First edition, with 28 scenes from the launch of ChatGPT onward.
- n: 2
  date: 2026-10-18
  ko: ChatGPT 광고, 챗봇에 털어놓은 아이들, 음악 계약, 블록의 감원, 소라 종료까지 장면 5개를 더했다.
  en: Adds five scenes, from ads in ChatGPT, teens confiding in chatbots and music licensing deals to Block’s layoffs and the end of Sora.
- n: 3
  date: 2026-10-27
