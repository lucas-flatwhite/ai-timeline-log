- from: 2022-11
  to: "2023"
  ko:
    title: 묻고 답하기
    body: 사람이 질문하고 AI가 글로 답했다. 경쟁은 누가 더 그럴듯하게 답하느냐였고, 규칙을 만드는 논의가 막 시작됐다.
  en:
    title: "Ask and Answer"
    body: "People asked questions and AI answered in text. The race was over whose answers sounded more convincing, and talks on writing the rules had only just begun."
- from: "2024"
  to: "2025"
  ko:
    title: 생각하고 손쓰기
    body: AI가 영상과 목소리를 다루고, 답하기 전에 추론하고, 화면을 보며 코드를 고쳤다. 경쟁의 단위가 모델에서 데이터센터와 전력으로 커졌다.
  en:
    title: "Think and Act"
    body: "AI handled video and voice, reasoned before answering, and fixed code while looking at the screen. The unit of competition grew from models to data centers and power."
- from: "2026"
  ko:
    title: 맡기고 통제하기
    body: 사람이 AI에게 몇 시간짜리 일을 맡기기 시작했다. 같은 능력이 보안 위협이 되자 모델을 언제, 누구에게 공개할지를 정부와 회사가 함께 따지게 됐다.
  en:
    title: "Delegate and Control"
    body: "People began handing AI tasks that take hours. When the same abilities became a security threat, governments and companies began to weigh together when, and to whom, a model should be released."
