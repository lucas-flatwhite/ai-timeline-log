items:
  - date: 2024-09-20
    ko: 컨스텔레이션, 마이크로소프트와 20년 전력 구매 계약. 2019년 문을 닫은 스리마일섬 1호기를 2028년까지 다시 돌려 약 835MW를 공급한다.
    en: "Constellation signs a 20-year power purchase agreement with Microsoft to restart Three Mile Island Unit 1, shut in 2019, and bring about 835 MW back online by 2028."
    glyph: 835MW
    pic: bolt
  - date: 2024-10-14
    ko: 구글, 카이로스 파워와 소형 원자로 여러 기에서 2035년까지 500MW를 받기로 계약. 첫 원자로는 2030년이 목표다.
    en: "Google signs a deal with Kairos Power to buy 500 MW from a fleet of small modular reactors by 2035, with the first planned for 2030."
    glyph: 500MW
  - date: 2024-10-16
    ko: 아마존, 소형 원자로 회사 X-energy에 투자하고 2039년까지 5GW가 넘는 원전을 짓는다는 목표를 내놓았다.
    en: "Amazon invests in small modular reactor developer X-energy and sets a goal of bringing more than 5 GW of nuclear power online by 2039."
    glyph: 5GW
ko:
  kicker: 전력
  title: 원전을 찾는 데이터센터
  lede: AI 데이터센터가 쓰는 전력이 늘자 빅테크가 원자력 발전과 직접 계약하기 시작했다. 1979년 사고로 알려진 스리마일섬 원전도 다시 켜기로 했다.
en:
  kicker: "Power"
  title: "Data Centers Go Nuclear"
  lede: "As AI data centers drew more power, Big Tech began signing deals directly for nuclear energy. One of them restarts a reactor at Three Mile Island, the site of the 1979 accident."
