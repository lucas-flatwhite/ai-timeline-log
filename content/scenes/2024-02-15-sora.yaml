items:
  - date: 2023-12-06
    ko: 구글, 멀티모달 모델 제미나이 1.0 발표. 이듬해 2월 바드도 제미나이로 이름을 바꿨다.
    en: "Google announces Gemini 1.0, a multimodal model, and the following February renames Bard to Gemini as well."
    glyph: Gemini
  - date: 2023-12-27
    ko: 뉴욕타임스, 기사 무단 학습을 이유로 OpenAI와 마이크로소프트를 제소.
    en: "The New York Times sues OpenAI and Microsoft, saying they trained on its articles without permission."
    glyph: NYT
  - date: 2024-02-15
    ko: Sora 시연. 같은 날 Gemini 1.5 발표, 컨텍스트 100만 토큰.
    en: "OpenAI demonstrates Sora; the same day, Google announces Gemini 1.5, with a context of one million tokens."
    glyph: Sora
  - date: 2024-02-22
    ko: 구글, 제미나이 인물 이미지 생성 중단. 역사 속 인물을 부정확하게 그린다는 비판.
    en: "Google pauses Gemini’s image generation of people after criticism that it depicted historical figures inaccurately."
    glyph: { ko: "인물", en: "PEOPLE" }
ko:
  kicker: 영상
  title: 소라, 문장이 영상이 되다
  lede: OpenAI가 글만으로 최대 1분 길이의 사실적인 영상을 만드는 Sora를 시연했다. 같은 날 구글은 100만 토큰을 읽는 모델을 내놓았다.
en:
  kicker: "Video"
  title: "Sora Turns Sentences into Video"
  lede: "OpenAI demonstrated Sora, which makes realistic videos up to a minute long from text alone. The same day, Google released a model that reads a million tokens."
