ko:
  kicker: 중국
  title: 중국 AI의 상장 물결
  lede: 미국의 칩 통제 아래 중국 GPU 회사들이 상하이에 상장해 첫날 주가가 몇 배로 뛰었다. 이어 중국 AI 연구소들이 홍콩에 상장했다. 미국 연구소들이 상장 서류를 내기 다섯 달 전이었다.
en:
  kicker: "China"
  title: "China’s AI Listing Wave"
  lede: "Under U.S. chip controls, Chinese GPU makers listed in Shanghai and saw their shares multiply on day one. Chinese AI labs then listed in Hong Kong, five months before U.S. labs filed to go public."
