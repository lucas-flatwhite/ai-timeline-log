items:
  - date: 2023-05-01
    ko: 제프리 힌턴, AI 위험을 자유롭게 말하겠다며 10년 일한 구글을 떠났다.
    en: "Geoffrey Hinton leaves Google after ten years, saying he wants to speak freely about the risks of AI."
    glyph: { ko: "힌턴", en: "HINTON" }
  - date: 2023-05-02
    ko: 미국 작가조합 파업 시작. AI 사용 제한이 핵심 쟁점이 됐다(9월 타결).
    en: "The Writers Guild of America goes on strike, with limits on AI use as a core issue (settled in September)."
    glyph: { ko: "파업", en: "STRIKE" }
    pic: picket
  - date: 2023-05-16
    ko: 샘 올트먼, 미 상원 청문회에서 강력한 모델에 정부 면허제를 두자고 제안.
    en: "Sam Altman proposes a government licensing regime for powerful models at a U.S. Senate hearing."
    glyph: { ko: "청문회", en: "HEARING" }
  - date: 2023-05-30
    ko: AI의 멸종 위험을 팬데믹·핵전쟁처럼 다루자는 한 문장 성명에 수백 명이 서명.
    en: "Hundreds sign a one-sentence statement saying the risk of extinction from AI should be treated like pandemics and nuclear war."
    glyph: { ko: "멸종", en: "EXTINCT" }
ko:
  kicker: 경고
  title: 만든 사람들의 경고
  lede: 딥러닝을 연 연구자와 AI 회사 대표가 직접 위험을 말하기 시작했다. 규제가 정치 의제가 됐다.
en:
  kicker: "Warning"
  title: "Warnings from the Builders"
  lede: "A researcher who pioneered deep learning and the heads of AI companies began to speak about the risks themselves. Regulation became a political issue."
  glyph: "WARNING"
