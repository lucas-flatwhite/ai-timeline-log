items:
  - date: 2025-08-04
    ko: 과학기술정보통신부, 한국 자체 AI 기반 모델을 만들 정예팀 5곳으로 네이버클라우드·SK텔레콤·LG AI연구원·NC AI·업스테이지를 뽑았다.
    en: "The Ministry of Science and ICT picks five teams to build Korea’s own foundation models: NAVER Cloud, SK Telecom, LG AI Research, NC AI and Upstage."
