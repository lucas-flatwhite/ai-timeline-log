ko:
  kicker: 한국
  title: 경주, GPU 26만 장
  lede: APEC 정상회의로 방한한 젠슨 황 엔비디아 CEO가 한국 정부와 기업에 최신 GPU 26만 장을 공급하겠다고 발표했다.
en:
  kicker: "Korea"
  title: "Gyeongju, 260,000 GPUs"
  lede: "In Korea for the APEC summit, NVIDIA CEO Jensen Huang announced that NVIDIA would supply 260,000 of the latest GPUs to the Korean government and companies."
