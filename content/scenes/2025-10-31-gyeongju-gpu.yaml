    ko: 서울 삼성동 치킨집에서 이재용 삼성전자 회장, 정의선 현대차그룹 회장과 ‘치맥 회동’.
    en: "At a fried chicken restaurant in Samseong-dong, Seoul, Huang meets Samsung Electronics Executive Chairman Jay Y. Lee and Hyundai Motor Group Executive Chair Euisun Chung over chicken and beer."
