corrections:
  - date: 2026-11-02
    ko: "‘황 CEO는 한국이 미국·중국 다음으로 GPU를 많이 가진 나라가 된다고 했다’를 고쳤습니다. 보도에 따르면 황은 비공개 자리에서 미국과 중국을 꼽았고, 한국이 3위가 된다는 것은 대통령실의 설명이었습니다(코리아헤럴드, How 260,000 Nvidia chips could redefine Korea’s AI ambitions)."
    en: "Corrected “Huang says Korea will have the most GPUs of any country after the United States and China.” According to reporting, Huang named the United States and China in a closed-door meeting, and the ranking of Korea third came from the presidential office (The Korea Herald, How 260,000 Nvidia chips could redefine Korea’s AI ambitions)."
items:
  - date: 2025-10-30
    ko: 서울 삼성동 치킨집에서 이재용 삼성전자 회장, 정의선 현대차그룹 회장과 ‘치맥 회동’.
    en: "At a fried chicken restaurant in Samseong-dong, Seoul, Huang meets Samsung Electronics Executive Chairman Jay Y. Lee and Hyundai Motor Group Executive Chair Euisun Chung over chicken and beer."
    glyph: { ko: "치맥", en: "CHICKEN" }
    pic: drumstick
    sources:
      - url: https://www.koreajoongangdaily.com/business/jensen-huang-a-rock-star-as-nvidia-samsung-hyundai-chiefs-celebrate-partnership-over-chicken-and-beer/12108621
        title: Jensen Huang a rock star as Nvidia, Samsung, Hyundai chiefs celebrate partnership over chicken and beer
        publisher: Korea JoongAng Daily
  - date: 2025-10-31
    ko: 정부와 삼성·SK·현대차에 각 5만 장, 네이버클라우드에 6만 장.
    en: "The government, Samsung, SK and Hyundai Motor Group get 50,000 each, and NAVER Cloud gets 60,000."
    glyph: { ko: "5만 장", en: "50,000" }
    sources:
      - url: https://nvidianews.nvidia.com/news/south-korea-ai-infrastructure
        title: NVIDIA, South Korea Government and Industrial Giants Build AI Infrastructure and Ecosystem to Fuel Korea Innovation, Industries and Jobs
        publisher: NVIDIA
  - date: 2025-10-31
    ko: 대통령실은 황 CEO가 비공개 자리에서 GPU가 가장 많은 나라로 미국, 그다음 중국을 꼽았다고 전하며, 약 30만 장이 되는 한국은 세계 3위가 된다고 했다.
    en: "The presidential office says Huang told a closed-door meeting that the United States has the most GPUs, followed by China, and that Korea’s roughly 300,000 will rank third."
    glyph: { ko: "3위", en: "No.3" }
    sources:
      - url: https://v.daum.net/v/20251102144141301
        title: How 260,000 Nvidia chips could redefine Korea’s AI ambitions
        publisher: The Korea Herald (via Daum)
ko:
  kicker: 한국
  title: 경주, GPU 26만 장
  lede: APEC 정상회의로 방한한 젠슨 황 엔비디아 CEO가 한국 정부와 기업에 최신 GPU 26만 장을 공급하겠다고 발표했다.
en:
  kicker: "Korea"
  title: "Gyeongju, 260,000 GPUs"
  lede: "In Korea for the APEC summit, NVIDIA CEO Jensen Huang announced that NVIDIA would supply 260,000 of the latest GPUs to the Korean government and companies."
