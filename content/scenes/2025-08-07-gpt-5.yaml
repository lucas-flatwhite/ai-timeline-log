    glyph: { ko: "바나나", en: "BANANA" }
    pic: banana
ko:
  kicker: 여름
  title: 인재 전쟁과 GPT-5
  lede: 메타가 거액으로 연구자를 끌어모았고, AI가 수학 올림피아드 금메달 점수를 냈다. 8월 OpenAI는 GPT-5와 6년 만의 가중치 공개 모델 gpt-oss를 냈다.
en:
  kicker: "Summer"
  title: "The Talent War and GPT-5"
