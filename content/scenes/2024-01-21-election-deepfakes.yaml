id: 2024-01-election-deepfakes
date: 2024-01-21
span:
  from: 2024-01
  to: 2024-02
added: 2026-11-02
topics: [safety, rules]
print:
  pattern: d
  motif: none
  glyph: FAKE
sources:
  - url: https://www.nbcnews.com/tech/security/fcc-votes-unanimously-ban-unsolicited-ai-robocalls-rcna137950
    title: FCC votes unanimously to ban unsolicited AI robocalls
    publisher: NBC News
  - url: https://news.microsoft.com/source/2024/02/16/technology-industry-to-combat-deceptive-use-of-ai-in-2024-elections/
