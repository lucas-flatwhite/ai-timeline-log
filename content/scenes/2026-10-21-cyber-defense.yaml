items:
  - date: 2026-10-21
    ko: PHP, 인증 없이 원격 코드를 실행할 수 있는 중대 취약점 2개를 고친 버전 공개. OpenAI는 Calif가 GPT-5.6 Sol로 결함을 찾았고, Wiz도 따로 찾아냈다고 밝혔다.
    en: "PHP releases fixes for two critical flaws that allow remote code execution without authentication, and OpenAI says Calif found a flaw with GPT-5.6 Sol while Wiz found the vulnerabilities independently."
    glyph: PHP
    pic: bug
    sources:
      - url: https://www.php.net/archive/2026.php
        title: "PHP: News Archive — October 21, 2026 security releases"
        publisher: PHP
      - url: https://openai.com/index/coordinated-disclosure-of-critical-vulnerabilities/
        title: "Patch the Planet: global response coordination as agents uncover critical vulnerabilities"
        publisher: OpenAI
  - date: 2026-10-28
    ko: 구글, 사이버 보안 능력을 높인 Gemini 4 Carbon 발표. 일부 사이버 방어 담당자에게 먼저 열고, 안전장치를 보완하면서 넓힌다.
    en: "Google announces Gemini 4 Carbon, a model with stronger cyber capabilities, and says selected cyber defenders will get it first, with wider access to follow as its safeguards improve."
    glyph: { ko: 제한, en: GATE }
    sources:
      - url: https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/
        title: "Gemini 4 Carbon: our next frontier model"
        publisher: Google
  - date: 2026-10-29
    ko: Mistral, 코딩과 사이버 방어를 내세운 Large 4의 가중치 공개. 조직이 자체 인프라에서 돌릴 수 있고, 악성 사이버 요청은 거부하도록 했다고 밝혔다.
    en: "Mistral releases the weights of Large 4, pitched for coding and cyber defense, so that organizations can run it on their own infrastructure, and says it is built to refuse malicious cyber requests."
    glyph: { ko: 가중치, en: OPEN }
    sources:
      - url: https://mistral.ai/news/mistral-large-4-oss/
        title: "Mistral Large 4 (Le Chonk): Built for Coders, Trusted by Defenders"
        publisher: Mistral AI
ko:
  kicker: 사이버 보안
  title: AI가 찾은 결함
  lede: AI가 널리 쓰이는 소프트웨어의 중대 결함을 찾아냈고, 결함이 알려지기 전에 고친 버전이 먼저 나왔다. 일주일 뒤 구글은 보안 능력을 높인 모델을 방어 담당자에게 먼저 열겠다고 했고, 이튿날 Mistral은 사이버 방어를 내세운 모델을 가중치째 공개했다.
en:
  kicker: Cybersecurity
  title: "Flaws Found by AI"
  lede: "AI found critical flaws in widely used software, and fixes shipped before the flaws were made public. A week later, Google said it would give defenders first access to a more cyber-capable model, and the next day Mistral released the weights of a model it pitched for cyber defense."
  glyph: DEFEND
