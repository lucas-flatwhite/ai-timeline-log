ko:
  kicker: 상장
  title: 나스닥에 상장한 Anthropic
  lede: 계산 인프라 약정을 공시한 Anthropic이 나스닥에서 거래를 시작했다. 회사 몫은 공모에서 수수료와 비용을 빼기 전 약 916억 달러였다. 구글과 엔비디아 등 일곱 곳은 별도 사모 발행에 참여했다.
en:
  kicker: IPO
  title: Anthropic Goes Public
  lede: Anthropic began trading on Nasdaq after disclosing its compute commitments. The company received about $91.6 billion in gross IPO proceeds. Seven investors, including Google and NVIDIA, took part in a separate private placement.
