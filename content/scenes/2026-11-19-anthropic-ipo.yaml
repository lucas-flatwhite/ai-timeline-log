    ko: Anthropic, 보통주 9억 8,000만 주의 공모가를 예비 범위인 70~78달러보다 높은 주당 83달러로 확정.
    en: Anthropic prices its initial public offering of 980 million shares at $83 per share, above the preliminary range of $70 to $78.
