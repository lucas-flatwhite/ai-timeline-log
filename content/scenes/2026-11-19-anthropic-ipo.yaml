    ko: Anthropic, 구주 매각과 추가 매수 옵션을 포함한 약 935억 달러 규모 공모와 별도의 260억 달러 규모 사모 발행 종결.
    en: Anthropic closes its $93.5 billion IPO, including selling stockholders’ shares and the fully exercised overallotment option, and a separate $26 billion private placement.
    glyph: $93.5B
